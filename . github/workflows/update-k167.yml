name: Update K167 Data
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: # lets you run it manually too

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch MightPulse
        env:
          KEY: ${{ secrets.MIGHTPULSE_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $KEY" \
            "https://api.mightpulse.com/v1/kingdoms/167" -o k167.json
          curl -s -H "Authorization: Bearer $KEY" \
            "https://api.mightpulse.com/v1/kingdoms/167/ranks?board=mystic_trial&limit=100" -o mystic.json
      - name: Save
        run: |
          git config user.name "k167-bot"
          git config user.email "bot@k167.local"
          git add k167.json mystic.json
          git commit -m "Update K167 data" || echo "No changes"
          git push
